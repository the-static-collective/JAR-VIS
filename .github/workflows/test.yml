name: JAR;VIS Genesis tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  node-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm test
      - name: Test native guest boundaries (offline only)
        run: python3 -m unittest discover -s test -p "test_live_guests_005.py" -v
      - name: Compile native evidence cold-verifier (does not run a model)
        run: python3 -m py_compile tools/verify-native-029.py tools/run-native-004.py tools/run-live-guests-005.py
