name: Public source observatory (pointer-only)
on:
  workflow_dispatch:
  schedule:
    - cron: "23 */6 * * *"
permissions:
  contents: write
concurrency:
  group: jarvis-source-observatory
  cancel-in-progress: false
jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test the distinction between source pointers and real consequences
        run: node --test test/source-observations.test.mjs
      - name: Read public repository refs without importing instructions or private data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node tools/sync-source-observations.mjs
      - name: Commit bounded observed snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add commons/source-observations-v1.json
          if git diff --cached --quiet; then echo "No new snapshot"; exit 0; fi
          git commit -m "chore(observatory): record public ref observations [skip ci]"
          git push origin HEAD:main
