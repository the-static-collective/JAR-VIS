name: JAR;VIS human review decisions (GitHub-authenticated)
on:
  issue_comment:
    types: [created]
permissions:
  contents: write
  issues: read
concurrency:
  group: jarvis-review-decisions
  cancel-in-progress: false
jobs:
  record:
    if: github.event.issue.pull_request == null
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Confirm only GitHub-authorized review changes can be journaled
        run: node --test test/review-decisions.test.mjs
      - name: Rebase current review ledger before evaluating this comment
        run: git pull --rebase origin main
      - name: Authenticate reviewer and append a bounded, source-only decision
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node tools/record-review-decision.mjs
      - name: Commit durable decision, never reinterpret it as real-world proof
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add commons/review-decisions-v1.json
          if git diff --cached --quiet; then echo "No authorized review decision"; exit 0; fi
          git commit -m "review(jarvis): record authenticated source-only disposition [skip ci]"
          git push origin HEAD:main
