name: Modal Return 001 (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: modal-return-001
  cancel-in-progress: false

jobs:
  synthetic-compute:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify token presence (without printing credentials)
        shell: bash
        run: |
          test -n "$MODAL_TOKEN_ID"
          test -n "$MODAL_TOKEN_SECRET"
      - name: Install Modal client
        run: python -m pip install 'modal>=1.3,<2'
      - name: Run one bounded CPU fixture on Modal
        run: modal run modal/return_worker_001.py
      - name: Upload synthetic return receipt
        uses: actions/upload-artifact@v4
        with:
          name: modal-return-001-receipt
          path: artifacts/modal-return-001.json
          if-no-files-found: error
          retention-days: 7
