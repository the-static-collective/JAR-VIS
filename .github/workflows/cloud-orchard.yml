name: Cloud Orchard 001 - bounded creative compute
on:
  push:
    paths:
      - 'cloud-orchard/**'
      - '.github/workflows/cloud-orchard.yml'
  pull_request:
    paths:
      - 'cloud-orchard/**'
      - '.github/workflows/cloud-orchard.yml'
  workflow_dispatch:
    inputs:
      engine:
        description: 'Where to execute the bounded batch'
        type: choice
        required: true
        default: github
        options: [github, modal]
permissions:
  contents: read
jobs:
  free-cpu:
    if: github.event_name != 'workflow_dispatch' || inputs.engine == 'github'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fail-closed contracts
        run: PYTHONPATH=cloud-orchard python -m unittest discover -s cloud-orchard -p 'test_*.py' -v
      - name: Assemble proposal cards within GitHub runner
        run: python cloud-orchard/orchard.py --mode github-actions --out dist/cloud-orchard
      - uses: actions/upload-artifact@v4
        with:
          name: cloud-orchard-github-cpu
          path: dist/cloud-orchard/
          retention-days: 7
  modal-cpu:
    if: github.event_name == 'workflow_dispatch' && inputs.engine == 'modal'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Require deliberate credentials
        shell: bash
        run: |
          if [[ -z "$MODAL_TOKEN_ID" || -z "$MODAL_TOKEN_SECRET" ]]; then
            echo 'HOLD: GitHub Actions secrets for Modal are absent'; exit 1
          fi
      - name: Local offline contract tests
        run: PYTHONPATH=cloud-orchard python -m unittest discover -s cloud-orchard -p 'test_*.py' -v
      - name: Install Modal SDK
        run: python -m pip install 'modal>=1.0,<2.0'
      - name: Remote four-container maximum proposal fanout
        run: modal run cloud-orchard/modal_orchard.py --out dist/cloud-orchard
      - uses: actions/upload-artifact@v4
        with:
          name: cloud-orchard-modal-cpu
          path: dist/cloud-orchard/
          retention-days: 7
